<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Казанок</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FFFFFF">
<style>
/* Layout: Threads-like. Phone: feed column + flat icon-only bottom bar with a centre "+".
   Desktop: narrow icon rail on the left + one centred 640px column in a rounded panel.
   Palette: near-monochrome (ink on white / white on #101010), hairline dividers, heart red for favourites.
   Flowers survive as six small colour accents (f0–f5): recipe "avatars", photo-less covers, tag dots. */
:root {
  --bg: #FAFAFA;
  --surface: #FFFFFF;
  --surface-2: #F3F3F3;
  --line: #E4E4E4;
  --line-strong: #CFCFCF;
  --nav-off: #9A9A9A;
  --fg: #000000;
  --muted: #737373;
  --accent: #000000;
  --accent-hover: #262626;
  --accent-fg: #FFFFFF;
  --accent-soft: #F0F0F0;
  --love: #FF3040;
  --herb: #1E7A46;
  --herb-soft: #E6F3EB;
  --warn: #8A5A00;
  --warn-soft: #FBF0D2;
  --glass: rgba(255, 255, 255, .86);
  --scrim: rgba(0, 0, 0, .4);
  --shadow: 0 0 0 1px rgba(0, 0, 0, .04), 0 12px 40px rgba(0, 0, 0, .12);
  /* flower accents: bg / petal / core */
  --f0-bg: #FCE4EE; --f0: #D8488E; --f0-core: #F6C445;   /* півонія */
  --f1-bg: #ECE7FB; --f1: #7C63D1; --f1-core: #F2D46B;   /* лаванда */
  --f2-bg: #E2F2E7; --f2: #4E9A6B; --f2-core: #F3E7A6;   /* шавлія */
  --f3-bg: #FDF1CC; --f3: #E3A21A; --f3-core: #7A4A12;   /* соняшник */
  --f4-bg: #E1EAFC; --f4: #4C78D0; --f4-core: #F5E9B8;   /* волошка */
  --f5-bg: #FDE5DC; --f5: #E0573A; --f5-core: #3A2A2E;   /* мак */

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px;
  --nav-h: 64px;
  --col: 640px;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0A0A; --surface: #101010; --surface-2: #1E1E1E; --line: #262626; --line-strong: #383838; --nav-off: #6B6B6B;
    --fg: #F3F5F7; --muted: #8A8A8A; --accent: #F3F5F7; --accent-hover: #FFFFFF; --accent-fg: #101010; --accent-soft: #232323;
    --herb: #6FCF97; --herb-soft: #13281C; --warn: #F2C35B; --warn-soft: #2E2410;
    --glass: rgba(16, 16, 16, .86); --scrim: rgba(0, 0, 0, .65); --shadow: 0 0 0 1px rgba(255, 255, 255, .06), 0 12px 40px rgba(0, 0, 0, .6);
    --f0-bg: #3A1B2C; --f0: #F28DBE; --f0-core: #F6C445;
    --f1-bg: #2A2342; --f1: #B5A3F3; --f1-core: #F2D46B;
    --f2-bg: #1B3326; --f2: #8ED1A6; --f2-core: #F3E7A6;
    --f3-bg: #3A2E10; --f3: #F3C452; --f3-core: #8A5A1E;
    --f4-bg: #1B2A44; --f4: #8FB1F2; --f4-core: #F5E9B8;
    --f5-bg: #3F1E17; --f5: #F28A6E; --f5-core: #1A1214;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0A0A; --surface: #101010; --surface-2: #1E1E1E; --line: #262626; --line-strong: #383838; --nav-off: #6B6B6B;
  --fg: #F3F5F7; --muted: #8A8A8A; --accent: #F3F5F7; --accent-hover: #FFFFFF; --accent-fg: #101010; --accent-soft: #232323;
  --herb: #6FCF97; --herb-soft: #13281C; --warn: #F2C35B; --warn-soft: #2E2410;
  --glass: rgba(16, 16, 16, .86); --scrim: rgba(0, 0, 0, .65); --shadow: 0 0 0 1px rgba(255, 255, 255, .06), 0 12px 40px rgba(0, 0, 0, .6);
  --f0-bg: #3A1B2C; --f0: #F28DBE; --f0-core: #F6C445;
  --f1-bg: #2A2342; --f1: #B5A3F3; --f1-core: #F2D46B;
  --f2-bg: #1B3326; --f2: #8ED1A6; --f2-core: #F3E7A6;
  --f3-bg: #3A2E10; --f3: #F3C452; --f3-core: #8A5A1E;
  --f4-bg: #1B2A44; --f4: #8FB1F2; --f4-core: #F5E9B8;
  --f5-bg: #3F1E17; --f5: #F28A6E; --f5-core: #1A1214;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--surface); color: var(--fg);
  font-family: var(--font); font-size: 15px; line-height: 1.45; letter-spacing: -.005em;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); }
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.ic { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ic.fill { fill: currentColor; }
.ic-sm { width: 20px; height: 20px; }

/* ---------- flower palettes ---------- */
.f0 { --fl: var(--f0); --fl-bg: var(--f0-bg); --fl-core: var(--f0-core); }
.f1 { --fl: var(--f1); --fl-bg: var(--f1-bg); --fl-core: var(--f1-core); }
.f2 { --fl: var(--f2); --fl-bg: var(--f2-bg); --fl-core: var(--f2-core); }
.f3 { --fl: var(--f3); --fl-bg: var(--f3-bg); --fl-core: var(--f3-core); }
.f4 { --fl: var(--f4); --fl-bg: var(--f4-bg); --fl-core: var(--f4-core); }
.f5 { --fl: var(--f5); --fl-bg: var(--f5-bg); --fl-core: var(--f5-core); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--fl); display: inline-block; }

/* ---------- shell ---------- */
.main {
  padding-left: var(--gl); padding-right: var(--gr);
  padding-bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));
}
.page { max-width: var(--col); margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }

.bnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-around;
  background: var(--glass); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6);
  padding: 0 var(--gr) env(safe-area-inset-bottom, 0px) var(--gl);
}
.nv {
  position: relative; flex: 1; max-width: 96px; min-height: var(--nav-h); display: grid; place-items: center;
  color: var(--nav-off); text-decoration: none; border-radius: var(--r-md); transition: color .15s, background .15s;
}
.nv .ic { width: 27px; height: 27px; }
.nv:hover { color: var(--muted); }
.nv[aria-current="page"] { color: var(--fg); }
.nv[aria-current="page"] .ic { stroke-width: 2.2; }
.nv-add span.sq { width: 52px; height: 42px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); transition: background .15s; }
.nv-add:hover span.sq { background: var(--accent-soft); color: var(--fg); }
.nv-add[aria-current="page"] span.sq { color: var(--fg); }
.badge {
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--love); color: #fff;
  font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums;
  box-shadow: 0 0 0 2px var(--surface);
}
.nv .badge { position: absolute; top: 12px; left: calc(50% + 6px); }

.rail { display: none; }
@media (min-width: 900px) {
  body { background: var(--bg); }
  body::before { background: var(--bg); }
  .bnav { display: none; }
  .main { margin-left: 76px; padding-bottom: 0; }
  .rail {
    display: flex; flex-direction: column; align-items: center; position: fixed; inset: 0 auto 0 0; width: 76px; z-index: 30;
    padding: 18px 0 18px; background: var(--bg);
  }
  .rail .logo { width: 48px; height: 48px; display: grid; place-items: center; border-radius: var(--r-md); margin-bottom: auto; }
  .rail .logo svg { width: 34px; height: 34px; transition: transform .25s; }
  .rail .logo:hover svg { transform: scale(1.08) rotate(-8deg); }
  .rail .navs { display: flex; flex-direction: column; gap: 6px; }
  .rail .nv { width: 60px; min-height: 56px; flex: none; }
  .rail .nv:hover { background: var(--surface-2); }
  .rail .nv-add span.sq { width: 44px; height: 40px; }
  .rail .nv-add:hover { background: transparent; }
  .rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
  .rail-foot .btn-icon { color: var(--muted); }
  .rail-foot .btn-icon:hover { color: var(--fg); }
  .page {
    background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: var(--r-xl) var(--r-xl) 0 0;
    min-height: calc(100vh - 60px); padding: 20px 24px 40px;
  }
}
@media (max-width: 899px) { .hide-mob { display: none !important; } }
@media (min-width: 900px) { .hide-desk { display: none !important; } }

/* ---------- buttons & inputs (PrimeReact Button / InputText look) ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px;
  border-radius: 12px; border: 1px solid var(--line-strong); background: transparent; color: var(--fg);
  font-weight: 600; font-size: 15px; text-decoration: none; white-space: nowrap; transition: background .15s, transform .1s, opacity .15s;
}
.btn:active { transform: scale(.97); }
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-outline { background: transparent; }
.btn-text { background: transparent; border-color: transparent; }
.btn-text:hover { background: var(--surface-2); }
.btn-lg { min-height: 52px; font-size: 16px; padding: 0 22px; }
.btn-icon { width: 44px; min-height: 44px; padding: 0; border-radius: 50%; background: transparent; border-color: transparent; }
.btn-icon:hover { background: var(--surface-2); }
.btn[disabled] { opacity: .35; pointer-events: none; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span, .label { font-size: 13.5px; font-weight: 600; color: var(--muted); }
.field small { color: var(--muted); font-size: 13px; }
.input {
  width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); font-size: 16px; outline: none; transition: border-color .15s;
}
.input:focus { border-color: var(--fg); }
textarea.input { resize: vertical; line-height: 1.5; }
select.input { appearance: none; padding-right: 36px; }
.select-wrap { position: relative; }
.select-wrap .ic { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--glass);
  backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6);
  margin-inline: calc(-1 * var(--gl)) calc(-1 * var(--gr)); padding: 6px var(--gr) 10px var(--gl);
  display: flex; flex-direction: column; gap: 10px;
}
.topbar-row { display: flex; align-items: center; gap: 8px; min-height: 52px; }
.topbar-row .grow { flex: 1; min-width: 0; }
.topbar-row .side { width: 44px; flex: none; display: flex; justify-content: center; }
.center-logo { flex: 1; display: flex; justify-content: center; }
.center-logo svg { width: 34px; height: 34px; }
.h-display { font-size: 28px; font-weight: 700; letter-spacing: -.025em; line-height: 1.15; }
.h-sub { color: var(--muted); font-size: 15px; }
.page-head { display: none; }
@media (min-width: 900px) {
  .topbar { position: static; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; margin: 0; padding: 0; }
  .page-head { display: flex; align-items: center; justify-content: center; min-height: 60px; font-weight: 700; font-size: 16px; position: relative; max-width: var(--col); margin-inline: auto; }
  .page-head .btn-icon { position: absolute; left: 0; }
  .topbar .h-display { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}

.search { position: relative; display: block; }
.search .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 20px; height: 20px; }
.search input { padding-left: 44px; padding-right: 48px; min-height: 46px; border-radius: 14px; background: var(--surface-2); border-color: transparent; }
.search input:focus { background: var(--surface); border-color: var(--line-strong); }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: calc(-1 * var(--gl)) calc(-1 * var(--gr)); padding-inline: var(--gl) var(--gr); }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 14px; border-radius: 19px;
  border: 1px solid var(--line-strong); background: transparent; font-size: 14.5px; font-weight: 600; white-space: nowrap;
}
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }
.chip .ic { width: 18px; height: 18px; }
.chip-sep { flex: none; width: 1px; background: var(--line); margin: 6px 2px; }
@media (min-width: 900px) { .chips { flex-wrap: wrap; overflow: visible; margin-inline: 0; padding-inline: 0; } }

.tag { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 10px; border-radius: 13px; background: var(--surface-2); color: var(--fg); font-size: 13px; font-weight: 600; }
.tag-herb { background: var(--herb-soft); color: var(--herb); }
.tag-warn { background: var(--warn-soft); color: var(--warn); }

/* ---------- covers ---------- */
.media { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: var(--surface-2); overflow: hidden; }
.cover-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.cover { position: absolute; inset: 0; background: var(--fl-bg); }
.cover svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.cover .pt { fill: var(--fl); }
.cover .pt2 { fill: color-mix(in srgb, var(--fl) 55%, var(--fl-bg)); }
.cover .cr { fill: var(--fl-core); }
.cover .lf { fill: color-mix(in srgb, var(--f2) 70%, var(--fl-bg)); }
.cover .sd { fill: color-mix(in srgb, var(--fl-core) 60%, var(--fl)); }
.ava { position: relative; display: block; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex: none; box-shadow: 0 0 0 .5px var(--line-strong); }
.ava .cover svg, .thumb .cover svg, .today .pic .cover svg { transform: scale(1.6); transform-origin: 70% 43%; }

/* ---------- feed ---------- */
.results-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.results-head .count { color: var(--muted); font-size: 14px; }
.results-head .select-wrap select { min-height: 38px; border-radius: 19px; padding-left: 14px; font-size: 14px; font-weight: 600; border-color: var(--line-strong); background: transparent; }
.feed { display: flex; flex-direction: column; margin-inline: calc(-1 * var(--gl)) calc(-1 * var(--gr)); }
@media (min-width: 900px) { .feed { margin-inline: -24px; } }
.post { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 14px var(--gr) 8px var(--gl); border-top: 1px solid var(--line); }
@media (min-width: 900px) { .post { padding-inline: 24px; } }
.post-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.post-head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.post-head h3 { font-size: 15.5px; font-weight: 650; line-height: 1.3; min-width: 0; }
.post-head h3 a { text-decoration: none; }
.post-head h3 a::after { content: ""; position: absolute; inset: 0; }
.post-head .t { color: var(--muted); font-size: 14.5px; white-space: nowrap; margin-left: auto; font-variant-numeric: tabular-nums; }
.post-text { font-size: 15px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.post-tags { display: flex; flex-wrap: wrap; gap: 2px 12px; color: var(--muted); font-size: 13.5px; }
.post-tags span { display: inline-flex; align-items: center; gap: 5px; }
.post-media { position: relative; display: block; margin-top: 8px; border-radius: var(--r-md); overflow: hidden; aspect-ratio: 4 / 3; max-width: 420px; max-height: 300px; border: .5px solid var(--line-strong); }
.post-actions { position: relative; z-index: 1; display: flex; align-items: center; gap: 2px; margin: 4px 0 0 -10px; }
.act { width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; display: grid; place-items: center; color: var(--fg); text-decoration: none; }
.act:hover { background: var(--surface-2); }
.act .ic { width: 22px; height: 22px; }
.act.on { color: var(--love); }
.act.on .ic, .btn-icon.on .ic { animation: pop .35s ease-out; }
@keyframes pop { 40% { transform: scale(1.3); } }
.act-meta { color: var(--muted); font-size: 13.5px; margin-left: 8px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 48px 16px; color: var(--muted); }
.empty .ic { width: 44px; height: 44px; stroke-width: 1.2; }
.empty b { color: var(--fg); font-size: 17px; }
.foot-note { text-align: center; color: var(--muted); font-size: 13.5px; padding: 20px 0 0; }
.linkbtn { background: none; border: 0; padding: 8px; color: var(--fg); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; }

/* ---------- today: a pinned post ---------- */
.today { display: grid; grid-template-columns: minmax(0, 1fr) 88px; gap: 14px; align-items: center; padding: 16px; border: 1px solid var(--line); border-radius: var(--r-lg); }
.today .k { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.today h2 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; margin: 4px 0 4px; }
.today h2 a { text-decoration: none; }
.today .why { color: var(--muted); font-size: 14px; }
.today .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.today .row .btn { min-height: 40px; font-size: 14.5px; padding: 0 14px; }
.today .pic { position: relative; width: 88px; aspect-ratio: 1; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 .5px var(--line-strong); }
@media (min-width: 900px) { .today { grid-template-columns: minmax(0, 1fr) 120px; padding: 20px; } .today .pic { width: 120px; } .today h2 { font-size: 24px; } }

/* ---------- recipe page ---------- */
.d-top { display: grid; gap: 16px; }
.d-media { position: relative; aspect-ratio: 4 / 3; max-height: 46vh; width: auto; margin-inline: calc(-1 * var(--gl)) calc(-1 * var(--gr)); overflow: hidden; background: var(--surface-2); }
.d-bar { position: absolute; left: 0; right: 0; top: 0; z-index: 2; display: flex; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) var(--gr) 10px var(--gl); }
.d-bar .grow { flex: 1; }
.d-bar .btn-icon { background: var(--glass); color: var(--fg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.d-bar .btn-icon.on { color: var(--love); }
.d-head { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.d-head h1 { font-size: 28px; font-weight: 700; line-height: 1.15; letter-spacing: -.025em; }
.d-head .desc { font-size: 16px; line-height: 1.5; max-width: 60ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0; border-block: 1px solid var(--line); }
.facts div { padding: 10px 0; }
.facts div + div { padding-left: 14px; border-left: 1px solid var(--line); }
.facts dt { font-size: 13px; color: var(--muted); }

  // qty formatting with kitchen-friendly fractions
  function fmtQty(q, unit) {
    if (q == null) return '';
    if (unit === 'г' || unit === 'мл') { return String(q >= 100 ? Math.round(q / 10) * 10 : Math.round(q)); }

  function beep() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();

        var o = audio.createOscillator(), g = audio.createGain();

        g.gain.setValueAtTime(.0001, audio.currentTime + t); g.gain.exponentialRampToValueAtTime(.3, audio.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + t + .25);

    } catch (e) {}
    try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {}
  }

      totalMin: parseInt(d.totalMin, 10) || null, servings: Math.max(1, parseInt(d.servings, 10) || 1),

  function resizeImage(file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 1200, s = Math.min(1, max / Math.max(img.width, img.height));
        var cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        cb(cv.toDataURL('image/jpeg', .82));
      };
      img.onerror = function () { toast('Не вдалося прочитати це зображення. Спробуйте JPG або PNG.'); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

    'shop-toggle': function (el) { var ids = el.dataset.ids.split(','), items = S.shopping.filter(function (i) { return ids.indexOf(i.id) >= 0; }); var v = !items.every(function (i) { return i.checked; }); items.forEach(function (i) { i.checked = v; }); save(); render(); },
    'shop-del': function (el) { var ids = el.dataset.ids.split(','); var removed = S.shopping.filter(function (i) { return ids.indexOf(i.id) >= 0; }); S.shopping = S.shopping.filter(function (i) { return ids.indexOf(i.id) < 0; }); save(); render(); toast('Прибрано: ' + removed[0].name, 'Повернути', function () { S.shopping = S.shopping.concat(removed); save(); render(); }); },
    'shop-clear': function () { var removed = S.shopping.filter(function (i) { return i.checked; }); S.shopping = S.shopping.filter(function (i) { return !i.checked; }); save(); render(); toast('Куплене прибрано', 'Повернути', function () { S.shopping = S.shopping.concat(removed); save(); render(); }); },
    'shop-view': function (el) { U.shopView = el.dataset.v; render(); },
    'shop-copy': function () { var txt = 'Купити:\n' + merged(S.shopping.filter(function (i) { return !i.checked; })).map(function (g) { return '— ' + g.name + (g.qty != null ? ', ' + KZ.fmtQty(g.qty, g.unit) + ' ' + g.unit : ''); }).join('\n'); copyText(txt, 'Список скопійовано'); },
    parse: function () { doParse(true); },
    sample: function () { var p = $('#paste'); p.value = KZ.SAMPLE_PASTE; doParse(true); },
    save: function () { saveDraft(); },
    'photo-del': function () { U.draft.photoUrl = null; $('#photo-block').innerHTML = photoBlock(); },
    'tag-add': function (el) { addTag(el.dataset.v); },
    'tag-del': function (el) { U.draft.tags.splice(+el.dataset.i, 1); $('#tags-block').innerHTML = tagsBlock(); }
  };
  function addTag(v) {
    v = v.trim(); if (!v) return; v = v.charAt(0).toUpperCase() + v.slice(1);
    if (U.draft.tags.indexOf(v) < 0) U.draft.tags.push(v);
    $('#tags-block').innerHTML = tagsBlock(); var i = $('#tag-in'); if (i) i.focus();
  }
  function doParse(explicit) {
    var p = $('#paste'); var text = p ? p.value.trim() : '';
    if (!text) { if (explicit) { toast('Спершу вставте текст рецепта'); p && p.focus(); } return; }
    var o = KZ.parseRecipeText(text), d = U.draft;
    if (o.title) d.title = o.title;
    if (o.description) d.description = o.description;
    if (o.servings) d.servings = o.servings;
    if (o.totalMin) d.totalMin = o.totalMin;
    if (o.sourceUrl) d.sourceUrl = o.sourceUrl;
    if (o.ingredients.length) d.ingText = o.ingredients.map(KZ.ingToLine).join('\n');
    if (o.steps.length) d.stepText = o.steps.map(function (s) { return s.text; }).join('\n');
    var pv = p.value; render(); var np = $('#paste'); if (np) np.value = pv;
    toast('Заповнили форму: ' + o.ingredients.length + ' ' + KZ.plural(o.ingredients.length, 'інгредієнт', 'інгредієнти', 'інгредієнтів') + ', ' + o.steps.length + ' ' + KZ.plural(o.steps.length, 'крок', 'кроки', 'кроків') + '. Перевірте й збережіть.');
    var t = $('[data-field="title"]'); if (t) t.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var fn = A[el.dataset.action];
    if (!fn) return;
    if (el.dataset.action !== 'dock-open') e.preventDefault();
    fn(el, e);
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'q') { U.q = t.value; $('#results').innerHTML = resultsHtml(); $('#today').innerHTML = todayCard(); var cl = $('.search .clear'); if (cl) cl.hidden = !U.q; return; }
    if (t.dataset && t.dataset.field && U.draft) {
      U.draft[t.dataset.field] = t.value;
      if (t.dataset.field === 'ingText') $('#ing-prev').innerHTML = ingPreview();
      if (t.dataset.field === 'stepText') $('#step-prev').innerHTML = stepPreview();
      if (t.dataset.field === 'title') { var er = $('#err'); if (er) er.hidden = true; }
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'sort') { U.sort = t.value; $('#results').innerHTML = resultsHtml(); }
    if (t.id === 'photo-in' && t.files && t.files[0]) resizeImage(t.files[0], function (url) { U.draft.photoUrl = url; $('#photo-block').innerHTML = photoBlock(); });
  });
  document.addEventListener('paste', function (e) {
    if (e.target.id === 'paste' && U.draft && !U.draft.title && !U.draft.ingText) setTimeout(function () { doParse(false); }, 30);
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'shop-add') {
      e.preventDefault();
      var inp = $('#shop-in'), v = inp.value.trim(); if (!v) { inp.focus(); return; }
      var ing = KZ.parseIngredient(v); addToShopping(null, [ing], 1); render(); var ni = $('#shop-in'); if (ni) ni.focus();
    }
    if (e.target.id === 'editor') e.preventDefault();
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t.id === 'tag-in' && (e.key === 'Enter' || e.key === ',')) { e.preventDefault(); addTag(t.value); return; }
    if (e.key === 'Escape' && U.dlg) { closeDlg(); return; }
  });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && parseRoute().view === 'recipe') wakeOn(); });
  window.addEventListener('hashchange', render);

  applyTheme();
  render();
})();

</script>

</body></html>
