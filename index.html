<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Казанок: домашні рецепти</title>
    <meta
      name="description"
      content="Домашні рецепти: швидкий пошук, кроки з таймерами і список покупок."
    />
    <!-- No sign-in: anyone with the link can edit, so keep the app out of
         search results. Link previews (below) still work. -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta
      name="theme-color"
      content="#FFFFFF"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#101010"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="apple-mobile-web-app-title" content="Казанок" />

    <!-- Link previews (Telegram, Viber, WhatsApp, Slack, Facebook, X).
         Crawlers do not run JavaScript, so the image needs an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Казанок" />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:url" content="https://kazanok-f7ab7.web.app/" />
    <meta property="og:title" content="Казанок: домашні рецепти" />
    <meta
      property="og:description"
      content="Швидкий пошук, кроки з таймерами і список покупок для всієї родини."
    />
    <meta
      property="og:image"
      content="https://kazanok-f7ab7.web.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Казанок: домашні рецепти" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Казанок: домашні рецепти" />
    <meta
      name="twitter:description"
      content="Швидкий пошук, кроки з таймерами і список покупок для всієї родини."
    />
    <meta
      name="twitter:image"
      content="https://kazanok-f7ab7.web.app/og-image.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
